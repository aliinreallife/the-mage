name: Android Debug APK (Capacitor trial)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-debug.yml'
      - 'capacitor.config.json'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package*.json'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android build platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"'

      - name: Build current game as offline web assets
        run: |
          npm ci
          npm run build
          test -s dist/index.html
          test -f dist/manifest.webmanifest

      - name: Install temporary Capacitor tooling
        run: npm install --no-save --no-audit --no-fund @capacitor/core@8 @capacitor/android@8 @capacitor/cli@8

      - name: Use a side-by-side preview ID without stable signing secrets
        env:
          MAGE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MAGE_ANDROID_KEYSTORE_BASE64 }}
          MAGE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MAGE_ANDROID_KEYSTORE_PASSWORD }}
          MAGE_ANDROID_KEY_PASSWORD: ${{ secrets.MAGE_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$MAGE_ANDROID_KEYSTORE_BASE64" || -z "$MAGE_ANDROID_KEYSTORE_PASSWORD" || -z "$MAGE_ANDROID_KEY_PASSWORD" ]]; then
            node -e 'const fs=require("fs"); const f="capacitor.config.json"; const c=JSON.parse(fs.readFileSync(f,"utf8")); c.appId="ir.themage.preview"; c.appName="آخرین افسونگر آزمایشی"; fs.writeFileSync(f,JSON.stringify(c,null,2)+"\\n");'
            echo 'No stable signer configured: building ir.themage.preview so the existing ir.themage.debug app and its save data remain untouched.'
          else
            echo 'Stable signer configured: building upgradable ir.themage.debug package.'
          fi

      - name: Create Android shell and bundle assets
        run: |
          npx cap add android
          npx cap sync android
          test -s android/app/src/main/assets/public/index.html

      - name: Replace stock Capacitor icon and version the app
        env:
          GITHUB_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node scripts/android-assets.mjs
          VERSION_CODE=$((10000 + GITHUB_BUILD_NUMBER))
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          echo "APK versionCode=${VERSION_CODE}"

      - name: Assemble Android APK
        env:
          MAGE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MAGE_ANDROID_KEYSTORE_BASE64 }}
          MAGE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MAGE_ANDROID_KEYSTORE_PASSWORD }}
          MAGE_ANDROID_KEY_PASSWORD: ${{ secrets.MAGE_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          mkdir -p android-apk
          if [[ -n "$MAGE_ANDROID_KEYSTORE_BASE64" && -n "$MAGE_ANDROID_KEYSTORE_PASSWORD" && -n "$MAGE_ANDROID_KEY_PASSWORD" ]]; then
            # Stable secure signing: this same keystore must be retained for every future update.
            printf '%s' "$MAGE_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mage-signing.jks"
            (cd android && ./gradlew :app:assembleRelease --no-daemon)
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 \
              android/app/build/outputs/apk/release/app-release-unsigned.apk \
              "$RUNNER_TEMP/mage-aligned.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$RUNNER_TEMP/mage-signing.jks" --ks-key-alias mage \
              --ks-pass env:MAGE_ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:MAGE_ANDROID_KEY_PASSWORD \
              --out android-apk/the-mage.apk "$RUNNER_TEMP/mage-aligned.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android-apk/the-mage.apk
            rm -f "$RUNNER_TEMP/mage-signing.jks" "$RUNNER_TEMP/mage-aligned.apk"
            echo 'Signed with persistent repository-secret keystore: future builds can upgrade in place.'
          else
            echo '::warning::No persistent signing secrets configured. This temporary DEBUG-signed APK cannot upgrade a differently signed prior build. See docs/ANDROID-TESTING.md.'
            (cd android && ./gradlew :app:assembleDebug --no-daemon)
            cp android/app/build/outputs/apk/debug/app-debug.apk android-apk/the-mage.apk
          fi

      - name: Verify output
        run: |
          test -s android-apk/the-mage.apk
          ls -lh android-apk/the-mage.apk

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: the-mage-android-apk
          path: android-apk/the-mage.apk
          if-no-files-found: error
          retention-days: 14
